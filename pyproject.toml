[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-ap"
version = "0.1.0"
description = "Invoice-to-Decision Pipeline (AP Automation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "typer>=0.9.0",
    "rapidfuzz>=3.0.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "google-genai>=0.1.1",
    "faker>=20.0.0",
    "reportlab>=4.0.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[project.scripts]
invoice-ap = "invoice_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["invoice_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "live: marks tests as requiring live external API keys (deselect with '-m \"not live\"')",
]
