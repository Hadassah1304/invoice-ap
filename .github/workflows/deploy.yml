name: Build & Deploy to Azure Container Apps via Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-invoice-ap
  CONTAINER_APP_NAME: app-invoice-ap
  IMAGE_NAME: invoice-ap

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          # Replace failing Azure regional mirror with primary Ubuntu mirror & enforce 5s timeout
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive\.ubuntu\.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=5 || true
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0 sqlite3 || true

      - name: Install Python package & test dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install pytest httpx

      - name: Run fast unit tests
        run: |
          pytest tests/unit/ -v

  build-and-deploy:
    name: Build, Push to Docker Hub & Deploy to ACA
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (latest + commit SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure ContainerApp CLI extension
        run: |
          az extension add --name containerapp --upgrade --yes

      - name: Deploy new revision to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
